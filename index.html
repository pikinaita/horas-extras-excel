<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Horas Extra">
    <title>Horas Extraordinarias - Dropbox</title>
    
    <script src="https://unpkg.com/dropbox/dist/Dropbox-sdk.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            --bg-glass: rgba(26, 26, 26, 0.95);
            --accent-main: #ff6b00;
            --accent-hover: #ff8c00;
            --accent-light: #ffab70;
            --text-primary: #ffffff;
            --text-muted: #a0a0a0;
            --border-accent: rgba(255, 107, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border-accent);
            box-shadow: 0 8px 32px rgba(255, 107, 0, 0.15);
        }

        .header { margin-bottom: 24px; text-align: center; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--accent-light); }

        select, input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
        }

        select:focus, input:focus { border-color: var(--accent-main); background: #222222; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-primary { background: var(--accent-main); color: white; }
        .btn-success { background: #34c759; color: white; }
        .btn-danger { background: #ff3b30; color: white; }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .status-success { background: rgba(52, 199, 89, 0.15); color: #34c759; border: 1px solid rgba(52, 199, 89, 0.3); }
        .status-error { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.3); }
        .status-info { background: rgba(255, 255, 255, 0.05); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.1); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏲️ Horas Extras</h1>
            <p class="subtitle">Gestión directa en Dropbox (.xlsx y .xlsm)</p>
        </div>

        <div id="status"></div>

        <div id="loginSection" class="card">
            <p style="margin-bottom: 16px; font-size: 14px; text-align: center;">Conecta tu cuenta para editar el archivo original.</p>
            <button class="btn btn-primary" onclick="login()">🔐 Conectar con Dropbox</button>
        </div>

        <div id="appSection" class="hidden">
            <div class="card">
                <label>Archivo en Dropbox (.xlsx o .xlsm):</label>
                <input type="text" id="filePath" value="/Sg/Partes2026.xlsx" placeholder="/ruta/archivo.xlsx o .xlsm">
                <button class="btn btn-primary" style="margin-top: 12px;" onclick="loadAndPrepare()">📂 Cargar y Vincular</button>
                <button class="btn btn-danger" style="margin-top: 8px; padding: 10px; font-size: 13px;" onclick="logout()">🚪 Cerrar Sesión</button>
            </div>

            <div id="editorSection" class="hidden">
                <div class="card">
                    <div class="form-group">
                        <label>Mes y Día</label>
                        <div style="display: flex; gap: 10px;">
                            <select id="monthSelect" style="flex: 2;">
                                <option value="ENERO">Enero</option>
                                <option value="FEBRERO">Febrero</option>
                                <option value="MARZO">Marzo</option>
                                <option value="ABRIL">Abril</option>
                                <option value="MAYO">Mayo</option>
                                <option value="JUNIO">Junio</option>
                                <option value="JULIO">Julio</option>
                                <option value="AGOSTO">Agosto</option>
                                <option value="SEPTIEMBRE">Septiembre</option>
                                <option value="OCTUBRE">Octubre</option>
                                <option value="NOVIEMBRE">Noviembre</option>
                                <option value="DICIEMBRE">Diciembre</option>
                            </select>
                            <input type="number" id="dayInput" placeholder="Día" min="1" max="31" style="flex: 1;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Turno</label>
                        <select id="shiftSelect">
                            <option value="3">Mañana</option>
                            <option value="4">Tarde</option>
                            <option value="5">Noche</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cobertura</label>
                        <select id="coverageSelect">
                            <option value="Sustitución Operador">Sustitución Operador</option>
                            <option value="Sustitución Jefe de Turno">Sustitución Jefe de Turno</option>
                        </select>
                    </div>

                    <button class="btn btn-success" onclick="saveToDropbox()">⚙️ Guardar en Archivo Original</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'gp93qf4f6ozo0oh';
        const XLSX_MAIN_NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
        const XLSX_REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
        let dbx = null;
        let currentWorkbook = null;
        let currentFileData = null;

        function parseXml(xml) {
            const xmlDocument = new DOMParser().parseFromString(xml, 'application/xml');
            if (xmlDocument.getElementsByTagName('parsererror').length) {
                throw new Error('El archivo Excel contiene XML no válido.');
            }
            return xmlDocument;
        }

        function resolveZipPath(basePath, target) {
            const parts = target.startsWith('/')
                ? target.slice(1).split('/')
                : basePath.split('/').slice(0, -1).concat(target.split('/'));
            const resolved = [];
            parts.forEach(part => {
                if (!part || part === '.') return;
                if (part === '..') resolved.pop();
                else resolved.push(part);
            });
            return resolved.join('/');
        }

        function columnNumber(cellReference) {
            const match = cellReference.match(/^[A-Z]+/i);
            if (!match) throw new Error(`Referencia de celda no válida: ${cellReference}`);
            return Array.from(match[0].toUpperCase()).reduce(
                (number, letter) => number * 26 + letter.charCodeAt(0) - 64,
                0
            );
        }

        function columnLetters(number) {
            let letters = '';
            while (number > 0) {
                const remainder = (number - 1) % 26;
                letters = String.fromCharCode(65 + remainder) + letters;
                number = Math.floor((number - 1) / 26);
            }
            return letters;
        }

        function getOrCreateRow(sheetData, rowNumber, xmlDocument) {
            const rows = Array.from(sheetData.getElementsByTagNameNS(XLSX_MAIN_NS, 'row'));
            let row = rows.find(item => Number(item.getAttribute('r')) === rowNumber);
            if (row) return row;

            row = xmlDocument.createElementNS(XLSX_MAIN_NS, 'row');
            row.setAttribute('r', String(rowNumber));
            const nextRow = rows.find(item => Number(item.getAttribute('r')) > rowNumber);
            if (nextRow) sheetData.insertBefore(row, nextRow);
            else sheetData.appendChild(row);
            return row;
        }

        function getOrCreateCell(row, cellReference, xmlDocument) {
            const wantedColumn = columnNumber(cellReference);
            const cells = Array.from(row.children).filter(item => item.localName === 'c');
            let cell = cells.find(item => item.getAttribute('r') === cellReference);
            if (cell) return cell;

            cell = xmlDocument.createElementNS(XLSX_MAIN_NS, 'c');
            cell.setAttribute('r', cellReference);
            const nextCell = cells.find(item => columnNumber(item.getAttribute('r')) > wantedColumn);
            if (nextCell) row.insertBefore(cell, nextCell);
            else row.appendChild(cell);
            return cell;
        }

        function setCellValue(cell, value, xmlDocument) {
            Array.from(cell.children).forEach(child => {
                if (['f', 'v', 'is'].includes(child.localName)) cell.removeChild(child);
            });

            if (value === null) {
                cell.removeAttribute('t');
                return;
            }

            cell.setAttribute('t', 'inlineStr');
            const inlineString = xmlDocument.createElementNS(XLSX_MAIN_NS, 'is');
            const text = xmlDocument.createElementNS(XLSX_MAIN_NS, 't');
            text.textContent = value;
            inlineString.appendChild(text);
            cell.insertBefore(inlineString, cell.firstChild);
        }

        async function writeXlsmPreservingMacros(sheetName, rowNumber, shiftColumn, coverage) {
            const zip = await JSZip.loadAsync(currentFileData);
            const workbookPath = 'xl/workbook.xml';
            const workbookFile = zip.file(workbookPath);
            const relationshipsFile = zip.file('xl/_rels/workbook.xml.rels');
            if (!workbookFile || !relationshipsFile) {
                throw new Error('No se pudo encontrar la estructura del libro Excel.');
            }

            const workbookXml = parseXml(await workbookFile.async('string'));
            const relationshipsXml = parseXml(await relationshipsFile.async('string'));
            const sheet = Array.from(workbookXml.getElementsByTagNameNS(XLSX_MAIN_NS, 'sheet'))
                .find(item => item.getAttribute('name') === sheetName);
            if (!sheet) throw new Error(`No se encontró la hoja ${sheetName} en el archivo.`);

            const relationshipId = sheet.getAttributeNS(XLSX_REL_NS, 'id') || sheet.getAttribute('r:id');
            const relationship = Array.from(relationshipsXml.getElementsByTagName('*'))
                .find(item => item.getAttribute('Id') === relationshipId);
            if (!relationship) throw new Error(`No se encontró la relación de la hoja ${sheetName}.`);

            const worksheetPath = resolveZipPath('xl/workbook.xml', relationship.getAttribute('Target'));
            const worksheetFile = zip.file(worksheetPath);
            if (!worksheetFile) throw new Error(`No se encontró el contenido de la hoja ${sheetName}.`);

            const worksheetXml = parseXml(await worksheetFile.async('string'));
            const sheetData = worksheetXml.getElementsByTagNameNS(XLSX_MAIN_NS, 'sheetData')[0];
            if (!sheetData) throw new Error(`La hoja ${sheetName} no contiene datos editables.`);

            const row = getOrCreateRow(sheetData, rowNumber, worksheetXml);
            [3, 4, 5].forEach(column => {
                const reference = `${columnLetters(column)}${rowNumber}`;
                setCellValue(getOrCreateCell(row, reference, worksheetXml), null, worksheetXml);
            });
            const shiftReference = `${columnLetters(shiftColumn)}${rowNumber}`;
            const coverageReference = `P${rowNumber}`;
            setCellValue(getOrCreateCell(row, shiftReference, worksheetXml), 'X', worksheetXml);
            setCellValue(getOrCreateCell(row, coverageReference, worksheetXml), coverage, worksheetXml);

            zip.file(worksheetPath, new XMLSerializer().serializeToString(worksheetXml));
            return zip.generateAsync({ type: 'arraybuffer' });
        }

        function showStatus(msg, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = msg;
            statusDiv.className = type ? 'status-' + type : 'status-info';
            statusDiv.style.display = 'block';
        }

        function login() {
            const redirectUri = window.location.origin + window.location.pathname;
            const authUrl = `https://www.dropbox.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}`;
            window.location.href = authUrl;
        }

        function logout() {
            localStorage.removeItem('dropbox_token');
            location.reload();
        }

        window.onload = function() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                const token = params.get('access_token');
                if (token) {
                    localStorage.setItem('dropbox_token', token);
                    window.location.hash = '';
                }
            }

            const token = localStorage.getItem('dropbox_token');
            if (token) {
                dbx = new Dropbox.Dropbox({ accessToken: token });
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                
                const now = new Date();
                const months = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
                document.getElementById('dayInput').value = now.getDate();
                document.getElementById('monthSelect').value = months[now.getMonth()];
            }
        };

        async function loadAndPrepare() {
            const path = document.getElementById('filePath').value.trim();
            showStatus('⏳ Descargando archivo desde Dropbox...', 'info');

            try {
                if (!/\.(xlsx|xlsm)$/i.test(path)) {
                    throw new Error('Selecciona un archivo con extensión .xlsx o .xlsm.');
                }
                const response = await dbx.filesDownload({ path: path });
                const blob = response.result.fileBlob;
                const arrayBuffer = await blob.arrayBuffer();

                currentFileData = arrayBuffer.slice(0);
                currentWorkbook = new ExcelJS.Workbook();
                await currentWorkbook.xlsx.load(arrayBuffer);

                document.getElementById('editorSection').classList.remove('hidden');
                showStatus('✅ Archivo vinculado. Puedes añadir datos.', 'success');
            } catch (err) {
                showStatus('❌ Error al cargar: ' + err.message, 'error');
            }
        }

        async function saveToDropbox() {
            if (!currentWorkbook) return;

            const month = document.getElementById('monthSelect').value;
            const day = parseInt(document.getElementById('dayInput').value);
            const shiftCol = parseInt(document.getElementById('shiftSelect').value);
            const coverage = document.getElementById('coverageSelect').value;
            const path = document.getElementById('filePath').value.trim();

            showStatus('⏳ Modificando y guardando...', 'info');

            try {
                let worksheet = null;
                currentWorkbook.eachSheet(s => {
                    if (s.name.toUpperCase().includes(month)) worksheet = s;
                });

                if (!worksheet) throw new Error(`No se encontró la hoja para ${month}`);

                let rowToEdit = -1;
                worksheet.eachRow({ includeEmpty: true }, (row, rowNumber) => {
                    if (rowNumber < 5 || rowNumber > 50) return;
                    const cell = row.getCell(2);
                    let val = cell.value;
                    let numVal = null;

                    if (val instanceof Date) numVal = val.getDate();
                    else if (typeof val === 'number') numVal = val;
                    else if (cell.type === 6 && cell.result) {
                        if (cell.result instanceof Date) numVal = cell.result.getDate();
                        else if (typeof cell.result === 'number') numVal = cell.result;
                    } else if (typeof val === 'string') {
                        const p = parseInt(val.trim());
                        if (!isNaN(p)) numVal = p;
                    }

                    if (numVal === day) rowToEdit = rowNumber;
                });

                if (rowToEdit === -1) rowToEdit = day + 6;

                const row = worksheet.getRow(rowToEdit);
                [3, 4, 5].forEach(c => row.getCell(c).value = null);
                row.getCell(shiftCol).value = 'X';
                row.getCell(16).value = coverage;

                const isMacroEnabled = /\.xlsm$/i.test(path);
                const buffer = isMacroEnabled
                    ? await writeXlsmPreservingMacros(worksheet.name, rowToEdit, shiftCol, coverage)
                    : await currentWorkbook.xlsx.writeBuffer();
                
                await dbx.filesUpload({
                    path: path,
                    contents: buffer,
                    mode: { '.tag': 'overwrite' },
                    autorename: false
                });

                if (isMacroEnabled) currentFileData = buffer.slice(0);
                showStatus(`✅ Día ${day} guardado directamente en Dropbox.`, 'success');
            } catch (err) {
                showStatus('❌ Error: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
